name: lydev-pay

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER di .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD di .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB di .env}
    volumes:
      - lydev_pay_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  app:
    build:
      context: .
      target: runtime
    container_name: lydev-pay-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QR_BROWSER_ENABLED: 'false'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      internal: {}
      caddy:
        aliases:
          - lydev-pay-app

  # Jalankan sekali setiap ada migrasi baru:
  # docker compose -f docker-compose.prod.yml --profile tools run --rm migrate
  migrate:
    profiles:
      - tools
    build:
      context: .
      target: build
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma migrate deploy
    networks:
      - internal

networks:
  internal: {}
  # Network bersama dengan Caddy yang sudah berjalan. Samakan namanya dengan
  # network milik Caddy (docker network ls) lewat CADDY_NETWORK di .env.
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy}

volumes:
  lydev_pay_data: {}
